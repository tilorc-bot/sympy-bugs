<style>
/* Colours are GitHub Primer functional tokens (light / dark default themes). */
:root {
  --accent-fg: #0969da; --accent-muted: #ddf4ff; --accent-border: #54aeff66; --accent-em: #0969da;
  --success-fg: #1a7f37; --success-muted: #dafbe1; --success-border: #4ac26b66; --success-em: #1f883d;

  --done-fg: #8250df; --done-muted: #fbefff; --done-border: #c297ff66; --done-em: #8250df;
  --sponsors-fg: #bf3989; --sponsors-muted: #ffeff7; --sponsors-border: #ff80c866; --sponsors-em: #bf3989;
  --neutral-fg: #59636e; --neutral-muted: #818b981f; --neutral-border: #d1d9e0b3; --neutral-em: #59636e;
  --bg: #ffffff; --panel: #ffffff; --inset: #f6f8fa; --ink: #1f2328; --muted: #59636e; --faint: #818b98;
  --line: #d1d9e0; --line-soft: #d1d9e0b3; --hover: #818b981a; --head: #f6f8fa; --sel: #ddf4ff80;
  --btn: #f6f8fa; --btn-hover: #eff2f5; --btn-border: #d1d9e0;
  --primary: #1f883d; --primary-hover: #1c8139; --primary-border: #1f232826;
  --code: #f6f8fa; --mark: #fff8c5; --overlay-shadow: 0 0 0 1px #d1d9e080, 0 6px 12px -3px #25292e0a, 0 6px 18px 0 #25292e1f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent-fg: #4493f8; --accent-muted: #388bfd1a; --accent-border: #388bfd66; --accent-em: #1f6feb;
    --success-fg: #3fb950; --success-muted: #2ea04326; --success-border: #2ea04366; --success-em: #238636;
    --attention-fg: #d29922; --attention-muted: #bb800926; --attention-border: #bb800966; --attention-em: #9e6a03;
    --severe-fg: #db6d28; --severe-muted: #db6d281a; --severe-border: #db6d2866; --severe-em: #bd561d;
    --danger-fg: #f85149; --danger-muted: #f851491a; --danger-border: #f8514966; --danger-em: #da3633;
    --done-fg: #ab7df8; --done-muted: #ab7df826; --done-border: #ab7df866; --done-em: #8957e5;
    --sponsors-fg: #db61a2; --sponsors-muted: #db61a21a; --sponsors-border: #db61a266; --sponsors-em: #bf4b8a;
    --neutral-fg: #9198a1; --neutral-muted: #656c7633; --neutral-border: #3d444db3; --neutral-em: #656c76;
    --bg: #0d1117; --panel: #0d1117; --inset: #010409; --ink: #f0f6fc; --muted: #9198a1; --faint: #656c76;
    --line: #3d444d; --line-soft: #3d444db3; --hover: #656c761a; --head: #151b23; --sel: #388bfd1a;
    --btn: #212830; --btn-hover: #262c36; --btn-border: #3d444d;
    --primary: #238636; --primary-hover: #29903b; --primary-border: #f0f6fc1a;
    --code: #151b23; --mark: #bb800966; --overlay-shadow: 0 0 0 1px #3d444d, 0 8px 24px 0 #010409;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent-fg: #4493f8; --accent-muted: #388bfd1a; --accent-border: #388bfd66; --accent-em: #1f6feb;
  --success-fg: #3fb950; --success-muted: #2ea04326; --success-border: #2ea04366; --success-em: #238636;
  --attention-fg: #d29922; --attention-muted: #bb800926; --attention-border: #bb800966; --attention-em: #9e6a03;
  --severe-fg: #db6d28; --severe-muted: #db6d281a; --severe-border: #db6d2866; --severe-em: #bd561d;
  --danger-fg: #f85149; --danger-muted: #f851491a; --danger-border: #f8514966; --danger-em: #da3633;
  --done-fg: #ab7df8; --done-muted: #ab7df826; --done-border: #ab7df866; --done-em: #8957e5;
  --sponsors-fg: #db61a2; --sponsors-muted: #db61a21a; --sponsors-border: #db61a266; --sponsors-em: #bf4b8a;
  --neutral-fg: #9198a1; --neutral-muted: #656c7633; --neutral-border: #3d444db3; --neutral-em: #656c76;
  --bg: #0d1117; --panel: #0d1117; --inset: #010409; --ink: #f0f6fc; --muted: #9198a1; --faint: #656c76;
  --line: #3d444d; --line-soft: #3d444db3; --hover: #656c761a; --head: #151b23; --sel: #388bfd1a;
  --btn: #212830; --btn-hover: #262c36; --btn-border: #3d444d;
  --primary: #238636; --primary-hover: #29903b; --primary-border: #f0f6fc1a;
  --code: #151b23; --mark: #bb800966; --overlay-shadow: 0 0 0 1px #3d444d, 0 8px 24px 0 #010409;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
a { color: var(--accent-fg); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
svg.i { width: 16px; height: 16px; flex: none; vertical-align: text-bottom; fill: currentColor; }
svg.i.s { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent-em); outline-offset: -2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px; }

/* ---------- page header ---------- */
header.top { padding-top: 16px; padding-bottom: 0; }
.repo-crumb { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.repo-crumb a { color: var(--ink); }
.repo-crumb b { font-weight: 600; }
.title-row { display: flex; align-items: center; gap: 8px; min-height: 32px; }
h1 { font-size: 20px; line-height: 1.5; margin: 0; font-weight: 600; }
.sub { color: var(--muted); margin: 2px 0 16px; max-width: 980px; }
.sub code { font-size: 12px; background: var(--neutral-muted); border-radius: 6px; padding: .2em .4em; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 32px; min-width: 32px; font: inherit; font-weight: 500;
  color: var(--muted); background: var(--btn); border: 1px solid var(--btn-border); border-radius: 6px; padding: 0 8px; cursor: pointer; }
.icon-btn:hover { color: var(--ink); background: var(--btn-hover); }
#theme { margin-left: auto; }

/* ---------- query bar (GitHub style) ---------- */
.qrow { display: flex; gap: 8px; align-items: center; }
.qwrap { position: relative; flex: 1; min-width: 0; }
.qbox { display: flex; height: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.qbox:focus-within { border-color: var(--accent-em); box-shadow: inset 0 0 0 1px var(--accent-em); }
.qfield { position: relative; flex: 1; min-width: 0; overflow: hidden; border-radius: 6px 0 0 6px; }
#q, #qhl { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0;
  padding: 0 8px 0 12px; font: inherit; font-size: 14px; line-height: 30px; letter-spacing: normal; white-space: pre; }
#qhl { color: var(--ink); overflow: hidden; pointer-events: none; }
#q { background: transparent; color: transparent; caret-color: var(--ink); outline: none; z-index: 1; }
#q::placeholder { color: var(--faint); }
#q::selection { background: var(--accent-border); color: transparent; }
#q::-webkit-search-cancel-button { display: none; }
#qhl .v { color: var(--accent-fg); }
#qhl .bad { text-decoration: wavy underline var(--danger-fg); text-decoration-skip-ink: none; text-underline-offset: 3px; }
#qclear { flex: none; align-self: center; border: 0; background: none; padding: 4px; margin-right: 2px; border-radius: 6px; color: var(--muted); cursor: pointer; display: none; }
#qclear:hover { color: var(--ink); background: var(--hover); }
.qwrap.has-q #qclear { display: inline-flex; }
#qgo { flex: none; width: 32px; border: 0; border-left: 1px solid var(--line); background: var(--btn); color: var(--muted);
  border-radius: 0 5px 5px 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
#qgo:hover { color: var(--ink); background: var(--btn-hover); }
.kbd { font: 11px/1 ui-monospace, monospace; border: 1px solid var(--line); box-shadow: inset 0 -1px 0 var(--neutral-border);
  border-radius: 6px; padding: 3px 5px; color: var(--muted); background: var(--inset); }

/* ---------- overlays: filter menus and query suggestions ---------- */
.pop { position: fixed; z-index: 60; background: var(--panel); border-radius: 12px; box-shadow: var(--overlay-shadow);
  width: 320px; max-width: calc(100vw - 16px); display: flex; flex-direction: column; overflow: hidden; }
.pop-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 0 16px; min-height: 40px; font-weight: 600; font-size: 14px; }
.pop-head .icon-btn { margin-left: auto; border: 0; background: none; }
.pop-filter { padding: 8px; border-bottom: 1px solid var(--line-soft); position: relative; }
.pop-filter svg { position: absolute; left: 18px; top: 16px; color: var(--muted); pointer-events: none; }
.pop-filter input { width: 100%; height: 32px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 0 8px 0 32px; }
.pop-filter input:focus { outline: none; border-color: var(--accent-em); box-shadow: inset 0 0 0 1px var(--accent-em); }
.pop ul { list-style: none; margin: 0; padding: 0 0 8px; overflow: auto; flex: 1; min-height: 0; }
.pop ul:focus-visible { outline: none; }
.sec { padding: 6px 16px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--head);
  border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
.sec:first-child { border-top: 0; }
.sec.plain { background: none; border: 0; padding: 8px 16px 2px; margin: 0; }
.sec.plain.div { border-top: 1px solid var(--line-soft); margin-top: 6px; padding-top: 10px; }
.opt { position: relative; display: grid; grid-template-columns: 16px 14px minmax(0, 1fr) auto; gap: 8px; align-items: start;
  margin: 0 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.opt.nosw { grid-template-columns: 16px minmax(0, 1fr) auto; }
.opt:hover { background: var(--hover); }
.opt.active { background: var(--hover); }
.opt.active::before { content: ""; position: absolute; left: -8px; top: 2px; bottom: 2px; width: 4px; border-radius: 6px; background: var(--accent-em); }
.opt + .opt .ol::before { content: ""; position: absolute; left: 0; right: -8px; top: -6px; border-top: 1px solid var(--line-soft); }
.opt:hover + .opt .ol::before, .opt.active + .opt .ol::before, .opt:hover .ol::before, .opt.active .ol::before { border-color: transparent; }
.cb { width: 16px; height: 16px; margin-top: 2px; border: 1px solid var(--neutral-fg); border-radius: 4px; background: var(--panel);
  display: flex; align-items: center; justify-content: center; color: #fff; }
.cb svg.i { width: 12px; height: 12px; visibility: hidden; }
.opt[aria-selected="true"] .cb { background: var(--accent-em); border-color: var(--accent-em); }
.opt[aria-selected="true"] .cb svg.i, .opt.excl .cb svg.i { visibility: visible; }
.opt.excl .cb { background: var(--danger-em); border-color: var(--danger-em); }
.opt.excl .ol b { text-decoration: line-through; text-decoration-color: var(--danger-fg); }
.ck { color: var(--ink); visibility: hidden; display: flex; margin-top: 2px; }
.opt[aria-selected="true"] .ck { visibility: visible; }
.opt .sw { margin-top: 3px; }
.opt .ol { position: relative; min-width: 0; }
.opt .ol b { font-weight: 400; display: block; line-height: 20px; overflow-wrap: anywhere; }
.opt .ol small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; margin-top: 1px; }
.opt .n { color: var(--muted); font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; text-align: right; min-width: 2ch; }
.opt.zero .ol b { color: var(--muted); }
.pop-empty { padding: 16px; color: var(--muted); text-align: center; }
.pop-foot { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-top: 1px solid var(--line-soft);
  font-size: 12px; color: var(--muted); }
.pop-foot button { margin-left: auto; font: inherit; font-weight: 500; color: var(--ink); background: var(--btn); border: 1px solid var(--btn-border);
  padding: 2px 10px; border-radius: 6px; cursor: pointer; }
.pop-foot button:hover { background: var(--btn-hover); }
.pop-foot button:disabled { color: var(--faint); cursor: default; background: none; }
#suggest { width: auto; }
#suggest ul { padding: 8px 0; }
#suggest .opt { grid-template-columns: 14px minmax(0, 1fr); align-items: center; }
#suggest .opt .ol b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; display: inline; }
#suggest .opt .ol small { display: inline; margin-left: 8px; }
#suggest .opt + .opt .ol::before { display: none; }

/* ---------- labels ---------- */
.sw { --ce: var(--neutral-em); width: 14px; height: 14px; border-radius: 50%; background: var(--ce, var(--neutral-em)); display: inline-block; flex: none; border: 1px solid var(--ce, var(--neutral-em)); }
.sw.none { background: none; border: 1px dashed var(--neutral-fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ce, var(--neutral-em)); display: inline-block; flex: none; }
.lbl { display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 18px; padding: 0 7px;
  border-radius: 2em; white-space: nowrap; vertical-align: 1px;
  color: #ffffff; background: var(--ce, var(--neutral-em)); border: 1px solid transparent; }
button.lbl { cursor: pointer; }
button.lbl:hover { filter: brightness(1.1); }
.lbl.plain { color: var(--ink); background: var(--neutral-muted); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lbl { color: var(--c, var(--neutral-fg)); background: var(--cb, var(--neutral-muted)); border-color: var(--cbd, var(--neutral-border)); }
  :root:not([data-theme="light"]) .lbl.plain { color: var(--ink); }
}
:root[data-theme="dark"] .lbl { color: var(--c, var(--neutral-fg)); background: var(--cb, var(--neutral-muted)); border-color: var(--cbd, var(--neutral-border)); }
:root[data-theme="dark"] .lbl.plain { color: var(--ink); }
.lbl svg.i { width: 12px; height: 12px; }
.counter { display: inline-block; min-width: 20px; padding: 0 6px; font-size: 12px; font-weight: 600; line-height: 18px; text-align: center;
  border-radius: 2em; background: var(--neutral-muted); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
main.wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0 24px; padding-bottom: 48px; align-items: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.resbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-height: 40px; padding: 8px 0; color: var(--muted); }
.resbar b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.resbar .sep { margin: 0 6px; color: var(--faint); }
#summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.quick { display: inline-flex; align-items: center; gap: 6px; font: inherit; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer; }
.quick b { color: var(--ink); }
.quick:hover { color: var(--accent-fg); }
.quick[aria-pressed="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.hint { color: var(--muted); }
#warn { color: var(--danger-fg); font-size: 12px; }
#warn:empty, #resetwrap:empty { display: none; }
#resetwrap { margin-left: auto; }
.reset { font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 4px;
  display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; font-weight: 600; }
.reset:hover { color: var(--accent-fg); }
.reset .x { display: inline-flex; background: var(--neutral-em); color: var(--panel); border-radius: 6px; padding: 1px; }
.reset:hover .x { background: var(--accent-em); }
.reset .x svg.i { width: 14px; height: 14px; }

/* ---------- list box ---------- */
#listbox { overflow: clip; }
.lhead { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
  padding: 8px 8px 8px 16px; min-height: 48px; background: var(--head); border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.tab { display: inline-flex; align-items: center; gap: 6px; font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); font-weight: 600; }

.fbtns { display: flex; flex-wrap: wrap; gap: 0; margin-left: auto; }
.fbtn { display: inline-flex; align-items: center; gap: 4px; height: 32px; font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0;
  padding: 0 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.fbtn:hover, .fbtn[aria-expanded="true"] { color: var(--ink); background: var(--hover); }
.fbtn.on { color: var(--ink); }
.fbtn .cnt { font-size: 12px; font-weight: 600; line-height: 18px; min-width: 20px; padding: 0 6px; border-radius: 2em;
  background: var(--accent-em); color: #fff; text-align: center; }
.fbtn .cnt.ex { background: var(--danger-em); }
.fbtn svg.tri { color: var(--muted); margin-left: 2px; }

#list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 16px 92px minmax(0, 1fr) auto; gap: 0 8px; padding: 8px 16px; min-height: 64px;
  border-top: 1px solid var(--line-soft); cursor: pointer; position: relative; }
.row:first-child { border-top: 0; }
.row { scroll-margin-top: 56px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent-em); }
.row .st { color: var(--c); padding-top: 4px; display: flex; }
.row-head { line-height: 24px; overflow-wrap: anywhere; }
.rmain { min-width: 0; }
.rmod { justify-self: start; align-self: start; display: block; height: 24px; font: inherit; font-size: 13px; line-height: 24px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px; }
.rmod:hover { color: var(--accent-fg); text-decoration: underline; }
.subtoggle { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; font: inherit; font-size: 12px; color: var(--accent-fg); background: none; border: 0; padding: 0; cursor: pointer; }
.subtoggle svg.tri, .rcbtn svg.tri { transform: rotate(-90deg); transition: transform .1s; }
.subtoggle[aria-expanded="true"] svg.tri, .rcbtn[aria-expanded="true"] svg.tri { transform: none; }
.subs { grid-column: 1 / -1; list-style: none; margin: 6px -16px -8px; padding: 0; border-top: 1px solid var(--line-soft); }
.row.sub { padding-left: 40px; background: var(--head); }
.row.sub::after { content: ""; position: absolute; left: 22px; top: 0; bottom: 50%; width: 10px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.row:has(.subs:hover):not(.sub) { background: none; }
.row-title { color: var(--ink); font-size: 16px; font-weight: 500; margin-right: 4px; }
.row-title:hover { color: var(--accent-fg); text-decoration: underline; }
.row-head .lbl { margin-right: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.row-meta { margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 18px; overflow-wrap: anywhere; }

// what the checker established, in a neutral style (never the now/should colours)

const SHOWN = new Set(["Kind", "Actual", "Expected", "Why it is wrong", "Suggested fix", "Related", "Caused by", "Source", "Notes on fixing", "Workaround"]);

function renderWelcome() {

}

function show(id) {

/* ---------------------------------------------------------------- keyboard shortcuts */
document.addEventListener("keydown", e => {

{ // for screenshots: ?open=kind opens that filter menu, ?open=sort the sort menu, ?open=q the query suggestions, ?verify=1 expands "How this was verified", ?fixpop=1 opens the fix checks
