name: Nightly re-check
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      report_all:
        description: Rewrite every status comment, not only changed ones
        type: boolean
        default: false

concurrency:
  group: nightly

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python checker/bugcheck.py fetch --repo "$GITHUB_REPOSITORY" --out issues.json
      - name: Install SymPy master
        run: |
          git clone --depth 1 https://github.com/sympy/sympy sympy-master
          pip install mpmath==1.3.0 pytest pytest-xdist hypothesis numpy scipy antlr4-python3-runtime==4.11.1 lark
      # Runs code from the issues. No token in this step's environment.
      - name: Run checks
        run: python checker/bugcheck.py run issues.json --sympy sympy-master --fixes basic --jobs 4 --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results.json
            issues.json

  report:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: results
      - name: Post status, close fixed issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ALL: ${{ inputs.report_all }}
        run: |
          if [ "$REPORT_ALL" = "true" ]; then FLAG=""; else FLAG="--only-changed"; fi
          python3 checker/bugcheck.py report results.json --issues issues.json --repo "$GITHUB_REPOSITORY" --close-fixed $FLAG --delay 1
