name: Update status
on:
  push:
    branches: [main]
    paths: ["bugs/**", "checker/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fixes:
        description: "How much to verify suggested fixes (full re-runs every bug per fix)"
        type: choice
        options: [applies, basic, full]
        default: applies

concurrency:
  group: update-status

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilers for printed C, C++ and Rust code
        run: gcc --version | head -1 && g++ --version | head -1 && rustc --version
      - name: Install SymPy master
        run: |
          git clone --depth 1 https://github.com/sympy/sympy sympy-master
          pip install mpmath==1.3.0 pytest pytest-xdist hypothesis numpy scipy antlr4-python3-runtime==4.11.1 lark
      # Push: re-check the bug files that changed, with full fix checks.
      # Nightly / manual: re-check everything against the latest master.
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FIXES_INPUT: ${{ inputs.fixes }}
        run: |
          ONLY=""; FIXES="${FIXES_INPUT:-applies}"
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE" 2>/dev/null \
             && ! git diff --name-only "$BEFORE" HEAD | grep -q '^checker/'; then
            git diff --name-only --diff-filter=AMR "$BEFORE" HEAD -- 'bugs/*.md' 'bugs/**/*.md' > changed.txt
            ONLY="--only $(tr '\n' ' ' < changed.txt)"; FIXES=full
          fi
          python checker/bugcheck.py status $ONLY --previous status.json --sympy sympy-master \
            --fixes "$FIXES" --jobs 4 --out new-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: status
          path: new-status.json

  commit:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: status
      - name: Commit status.json
        run: |
          mv new-status.json status.json
          git add status.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(python3 -c "import json; print((json.load(open('status.json'))['sympy'] or '')[:10])")
          git commit -qm "Update status (SymPy master $SHA)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

  # One readable issue per bug file, generated from the file and status.json.
  # Runs no bug code. Writes only issues whose content, labels or state changed.
  issues:
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Sync issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 checker/bugcheck.py sync-issues --status status.json --repo "$GITHUB_REPOSITORY" --max-minutes 320
