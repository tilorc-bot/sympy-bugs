name: Check issue
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

concurrency:
  group: check-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  run:
    # Comments only matter when they carry a suggested fix.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '```diff'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch the issue and the open issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          python checker/bugcheck.py fetch --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --out issue.json
          python checker/bugcheck.py fetch --repo "$GITHUB_REPOSITORY" --bodies-only --out open.json
      - name: Install SymPy master
        run: |
          git clone --depth 1 https://github.com/sympy/sympy sympy-master
          pip install mpmath==1.3.0 pytest pytest-xdist hypothesis numpy scipy antlr4-python3-runtime==4.11.1 lark
      # Runs code from the issue. No token in this step's environment.
      - name: Run checks
        run: python checker/bugcheck.py run issue.json --all-issues open.json --sympy sympy-master --fixes full --jobs 4 --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results.json
            issue.json

  report:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: results
      - name: Post status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 checker/bugcheck.py report results.json --issues issue.json --repo "$GITHUB_REPOSITORY"
