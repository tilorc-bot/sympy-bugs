name: Bug
description: Record a SymPy bug (verified automatically; not a request for a fix)
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Write Actual and Expected as doctests; see [SPEC.md](../blob/main/SPEC.md).
        The title should say what goes wrong, e.g. "latex() prints Mod(-x, y) and -Mod(x, y) identically".
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [crash, hang, wrong-meaning, invalid-output, lossy, ignored-setting, cosmetic, internal]
    validations: {required: true}
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Self-contained doctest of what SymPy master does now. Must match master exactly.
      render: pycon
      placeholder: |
        >>> from sympy import symbols, latex, Mod
        >>> x, y = symbols('x y')
        >>> print(latex(Mod(-x, y)))
        - x \bmod y
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Doctest that fails on master and passes once fixed. Runs after Actual. Prefer a property over an exact string.
      render: pycon
      placeholder: |
        >>> latex(Mod(-x, y)) != latex(-Mod(x, y))
        True
    validations: {required: true}
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: One or two sentences.
    validations: {required: true}
  - type: input
    id: caused_by
    attributes:
      label: Caused by
      description: "#N of the root-cause issue, if known"
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Other issues here or in sympy/sympy (e.g. sympy/sympy#23912)
  - type: textarea
    id: notes
    attributes:
      label: Notes on fixing
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Doctest that gets the right result on master today
      render: pycon
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Output of `git diff` against SymPy master
      render: diff
